<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>
  </head>
  <body>
    <div id="root">
      <!-- Loading indicator that shows while JavaScript loads -->
      <div id="initial-loader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background-color: #f9fafb;">
        <div style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: #1e40af;">JobRooster.lk</div>
        <div style="width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 1rem; font-family: system-ui, sans-serif; color: #6b7280;">Loading application...</p>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <script>
        // Remove loader when app loads
        window.addEventListener('load', function() {
          document.getElementById('initial-loader').style.display = 'none';
        });
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
